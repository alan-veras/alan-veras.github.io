  * { margin: 0; padding: 0; box-sizing: border-box; }

    --bg: #000;
    --fg: #fff;

  nav {

  a.link {
    display: flex;

    gap: 1rem;

    border: 1px solid var(--line);
    color: var(--fg);
    text-decoration: none;
    font-size: .82rem;
    letter-spacing: .08em;
    background: rgba(0,0,0,.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background .22s ease, border-color .22s ease, transform .22s ease;
  }

  a.link:hover,
  a.link:focus-visible {
    background: var(--hover);
    border-color: var(--fg);
    transform: translateX(4px);
    outline: none;
  }

  a.link svg {
    width: 17px;
    height: 17px;
    flex: none;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  a.link .arrow {
    margin-left: auto;
    color: var(--dim);
    transition: transform .22s ease, color .22s ease;
  }

  a.link:hover .arrow { transform: translateX(3px); color: var(--fg); }

  /* link principal: invertido, para puxar o olho antes dos outros */

    background: var(--fg);

    border-color: var(--fg);
    padding: 1.05rem 1.15rem;

  a.link.hero:hover,
  a.link.hero:focus-visible {

  }
  a.link.hero svg { margin-top: .1rem; }
  a.link.hero .arrow { color: var(--bg); opacity: .55; }
  a.link.hero:hover .arrow { opacity: 1; }

  .hero-text { display: flex; flex-direction: column; gap: .28rem; }

  }

  @media (prefers-reduced-motion: reduce) {
    a.link, a.link .arrow { transition: none; }

{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

const host = document.getElementById('scene');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 100);
camera.position.z = 15;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
host.appendChild(renderer.domElement);

// grafo de nos distribuidos numa esfera: cada no vira um ponto,
// e pares proximos viram aresta. le como topologia de rede.
const NODES = 150;
const RADIUS = 7.2;
const LINK_DIST = 3.1;

const points = [];
for (let i = 0; i < NODES; i++) {
  // distribuicao de fibonacci pra espalhar sem aglomerar nos polos
  const y = 1 - (i / (NODES - 1)) * 2;
  const r = Math.sqrt(1 - y * y);
  const theta = i * Math.PI * (3 - Math.sqrt(5));
  points.push(new THREE.Vector3(
    Math.cos(theta) * r * RADIUS,
    y * RADIUS,
    Math.sin(theta) * r * RADIUS
  ));
}

const graph = new THREE.Group();
scene.add(graph);

// nos
const nodeGeo = new THREE.BufferGeometry().setFromPoints(points);
graph.add(new THREE.Points(nodeGeo, new THREE.PointsMaterial({
  color: 0xffffff, size: 0.075, transparent: true, opacity: 0.85,
  sizeAttenuation: true
})));

// arestas: calculadas uma unica vez, depois so o grupo inteiro gira
const edges = [];
for (let i = 0; i < NODES; i++) {
  for (let j = i + 1; j < NODES; j++) {
    if (points[i].distanceTo(points[j]) < LINK_DIST) edges.push(points[i], points[j]);
  }
}
const edgeGeo = new THREE.BufferGeometry().setFromPoints(edges);
graph.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({
  color: 0xffffff, transparent: true, opacity: 0.14
})));

// pulso: um no aceso que salta pra outro no, tipo pacote atravessando a rede
const pulseGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3()]);
const pulse = new THREE.Points(pulseGeo, new THREE.PointsMaterial({
  color: 0xffffff, size: 0.3, transparent: true, opacity: 1, sizeAttenuation: true
}));
graph.add(pulse);

let hopFrom = points[0], hopTo = points[1], hopT = 0;
function nextHop() {
  hopFrom = hopTo;
  const near = points.filter(p => p !== hopFrom && p.distanceTo(hopFrom) < LINK_DIST);
  hopTo = near.length ? near[(Math.random() * near.length) | 0]
                      : points[(Math.random() * NODES) | 0];
  hopT = 0;
}

// icones de seguranca em wireframe, flutuando dos dois lados da esfera
function wire(geo, angle = 22, opacity = 0.32) {
  return new THREE.LineSegments(
    new THREE.EdgesGeometry(geo, angle),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity })
  );
}

function padlock() {
  const g = new THREE.Group();
  g.add(wire(new THREE.BoxGeometry(1.5, 1.2, 0.7)));
  const shackle = wire(new THREE.TorusGeometry(0.5, 0.1, 5, 12, Math.PI), 14);
  shackle.position.y = 0.6;
  g.add(shackle);
  return g;
}

function shield() {
  const s = new THREE.Shape();
  s.moveTo(-0.85, 0.9);
  s.lineTo(0.85, 0.9);
  s.lineTo(0.85, -0.1);
  s.quadraticCurveTo(0.85, -0.85, 0, -1.25);
  s.quadraticCurveTo(-0.85, -0.85, -0.85, -0.1);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.3, bevelEnabled: false });
  geo.center();
  return wire(geo, 18);
}

function key() {
  const g = new THREE.Group();
  g.add(wire(new THREE.TorusGeometry(0.42, 0.09, 5, 12), 14));
  const shaft = wire(new THREE.BoxGeometry(0.13, 1.3, 0.13));
  shaft.position.y = -0.95;
  g.add(shaft);
  const tooth = wire(new THREE.BoxGeometry(0.38, 0.13, 0.13));
  tooth.position.set(0.19, -1.45, 0);
  g.add(tooth);
  return g;
}

// caixa: le como container / imagem de infra
const container = () => wire(new THREE.BoxGeometry(1.15, 1.15, 1.15));

const icons = [
  { obj: padlock(),   side: -1, ny:  0.34, spin: 0.22, bob: 0.9 },
  { obj: container(), side: -1, ny: -0.38, spin: 0.30, bob: 1.3 },
  { obj: shield(),    side:  1, ny:  0.36, spin: 0.19, bob: 1.1 },
  { obj: key(),       side:  1, ny: -0.34, spin: 0.26, bob: 0.8 }
];

for (const it of icons) {
  it.obj.scale.setScalar(0.9);
  scene.add(it.obj);
}

// posiciona pelas bordas visiveis: em tela estreita nao ha margem, entao somem
function placeIcons() {
  const halfH = Math.tan(camera.fov * Math.PI / 360) * camera.position.z;
  const halfW = halfH * camera.aspect;
  const room = camera.aspect > 1.15;

  for (const it of icons) {
    it.obj.visible = room;
    it.baseX = it.side * halfW * 0.66;
    it.baseY = it.ny * halfH;
    it.obj.position.set(it.baseX, it.baseY, -1);
  }
}
placeIcons();

// parallax: a cena inclina de leve seguindo o cursor / o dedo
const target = { x: 0, y: 0 };
const current = { x: 0, y: 0 };

function aim(cx, cy) {
  target.x = (cx / innerWidth - 0.5) * 0.6;
  target.y = (cy / innerHeight - 0.5) * 0.6;
}
addEventListener('pointermove', e => aim(e.clientX, e.clientY), { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  placeIcons();
});

const clock = new THREE.Clock();

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!reduced) {
    graph.rotation.y += dt * 0.09;
    graph.rotation.x += dt * 0.025;

    hopT += dt * 1.6;
    if (hopT >= 1) nextHop();
    pulse.geometry.attributes.position.setXYZ(0,
      ...hopFrom.clone().lerp(hopTo, hopT).toArray());
    pulse.geometry.attributes.position.needsUpdate = true;

    // cada icone gira no proprio ritmo e boia de leve
    const t = clock.elapsedTime;
    for (const it of icons) {
      if (!it.obj.visible) continue;
      it.obj.rotation.y += dt * it.spin;
      it.obj.rotation.x = Math.sin(t * 0.3 * it.bob) * 0.16;
      it.obj.position.y = it.baseY + Math.sin(t * it.bob * 0.55) * 0.42;
    }
  }

  current.x += (target.x - current.x) * 0.045;
  current.y += (target.y - current.y) * 0.045;

  camera.position.x = current.x * 4;
  camera.position.y = -current.y * 4;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
frame();
</script>

<script>
/* chuva de termos: colunas de texto descendo pelo fundo, mais apagadas no centro
   pra nao brigar com o nome e os links. */
(function () {
  const cv = document.getElementById('rain');
  if (!cv || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const ctx = cv.getContext('2d');

  const WORDS = ['kubectl', 'terraform', 'docker', 'systemd', 'nginx', 'journalctl',
                 'ansible', 'helm', 'EC2', 'ECR', 'S3', 'Cloudflare',
                 'GitHub Actions', 'ARQ/Redis', 'Postgres', 'uptime',
                 'p95 latency', 'quality gate', 'Recall@5', 'LangGraph'];

  const FONT = 10;
  const STEP = 17;          // distancia vertical entre termos de uma coluna
  const TRAIL = 11;         // quantos termos formam o rastro

  let cols = [], dpr = 1;

  function build() {
    dpr = Math.min(devicePixelRatio, 2);
    cv.width = innerWidth * dpr;
    cv.height = innerHeight * dpr;
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    ctx.scale(dpr, dpr);
    ctx.font = FONT + "px 'JetBrains Mono', monospace";

    // texto so na borda extrema: adiante ficam os icones, e o miolo e do grafo
    const gap = 88;
    const band = Math.min(innerWidth * 0.1, 120);   // largura de cada faixa
    cols = [];

    for (let i = 0; i * gap < band; i++) {
      const dx = i * gap + gap * 0.5;
      // a coluna mais interna de cada faixa entra mais apagada, pra transicao suave
      const fade = 1 - (dx / band) * 0.55;
      for (const x of [dx, innerWidth - dx]) {
        cols.push({
          x,
          // a faixa da direita escreve pra dentro, senao termos longos vazam pela borda
          align: x > innerWidth / 2 ? 'right' : 'left',
          y: Math.random() * (innerHeight + TRAIL * STEP),
          speed: 22 + Math.random() * 26,
          fade,
          words: Array.from({ length: TRAIL },
            () => WORDS[(Math.random() * WORDS.length) | 0])
        });
      }
    }
  }

  let last = performance.now();

  function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    // limpa de verdade: pintar preto por cima acumularia e esconderia a esfera.
    // o rastro vem do alpha decrescente de cada termo, logo abaixo.
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    for (const c of cols) {
      c.y += c.speed * dt;

      for (let k = 0; k < TRAIL; k++) {
        const y = c.y - k * STEP;
        if (y < 0 || y > innerHeight) continue;
        // ponta de baixo acesa, cauda sumindo pra cima
        const alpha = (1 - k / TRAIL) * 0.42 * c.fade;
        ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
        ctx.textAlign = c.align;
        ctx.fillText(c.words[k], c.x, y);
      }

      if (c.y - TRAIL * STEP > innerHeight) {   // saiu inteira pela base
        c.y = Math.random() * -160;
        c.speed = 22 + Math.random() * 26;
        for (let k = 0; k < TRAIL; k++) {
          c.words[k] = WORDS[(Math.random() * WORDS.length) | 0];
        }
      }
    }
  }

  addEventListener('resize', build);
  build();
  requestAnimationFrame(tick);
})();
</script>
